<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      ARPES Workshop 2026 | Home
    </title>
    <style>

    /* 색상과 전체 폭은 여기에서 수정하세요. */
    :root {
      --background: #e6e3de;
      --ink: #292b29;
      --line: #f5f3ed;
      --width: 800px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 0 24px;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: "Avenir Next", "Century Gothic", "Trebuchet MS", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header, main, form, footer {
      width: calc(100% - 40px);
      max-width: var(--width);
      margin-left: auto;
      margin-right: auto;
    }

    /* 상단 로고와 메뉴 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(245, 243, 237, .55);
    }

    a { color: inherit; }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.8px;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 18px;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }

    nav a[aria-current="page"] {
      font-weight: 800;
      border-color: var(--ink);
    }

    nav a:hover { border-color: var(--line); }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    button svg { width: 19px; height: 19px; }
    [hidden] { display: none !important; }

    /* 검색창 높이를 작게 유지합니다. */
    form { margin-top: 12px; margin-bottom: 12px; }
    input {
      width: 100%;
      min-width: 0;
      padding: 7px 12px;
      border: 1px solid rgba(245, 243, 237, .9);
      border-radius: 0;
      background: rgba(255, 255, 255, .14);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.25;
    }
    input::placeholder { color: #4b4d49; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    /* 홈: 큰 제목과 여백 */
    main { margin-top: 0; }
    section { min-height: 550px; padding-top: 54px; }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1.07;
      font-weight: 800;
      letter-spacing: -3px;
    }
    .hero-title span { display: block; }
    .hero-title .year { margin-top: 8px; font-weight: 500; }
    .eyebrow {
      margin: 0 0 18px;
      font-size: 11px;
      letter-spacing: 2.4px;
      font-weight: 600;
      text-transform: uppercase;
    }


    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid rgba(245, 243, 237, .55);
      font-size: 10px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    /* 나중에 넣을 사진: 화면 폭에 맞춰 자동으로 줄어듭니다. */
    .home-photo {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 32px;
    }

    /* 모바일: 글자를 화면에 맞추고 메뉴를 줄바꿈합니다. */
    @media (max-width: 650px) {
      header { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav { width: 100%; gap: 4px 15px; }
      nav a { font-size: 13px; }
      section { padding-top: 40px; min-height: 480px; }
      h1 { letter-spacing: -1.8px; }
      footer { flex-wrap: wrap; }
    }
    </style>
  </head>
  <body>
    <!-- 상단: 로고와 메뉴 -->
    <header>
      <a class="brand" href="#home">
      ARPES Workshop 2026
    </a>
      <nav aria-label="Main navigation">
        <a href="#home" data-page="home">
          Home
        </a>
        <a href="#program" data-page="program">
          Program
        </a>
        <a href="#venue" data-page="venue">
          Venue
        </a>
        <a href="#sponsors" data-page="sponsors">
          Sponsors
        </a>
        <a href="#contact" data-page="contact">
          Contact
        </a>
        <button type="button" aria-label="Search tabs" aria-controls="search-form" aria-expanded="false">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="13" cy="13" r="10" stroke="currentColor" stroke-width="3"/>
            <path d="M21 21L30 30" stroke="currentColor" stroke-width="3"/>
          </svg>
        </button>
      </nav>
    </header>
    <form id="search-form" role="search" hidden>
      <input type="search" aria-label="Search tabs" placeholder="Search: Home, Program, Venue, Sponsors, Contact">
    </form>
    <!-- 본문: 아래 section 안에 각 탭의 내용을 넣으세요. -->
    <main>
      <!-- 각 section 안에 해당 탭의 내용을 추가하세요. -->
      <section id="home">
        <p class="eyebrow">Angle-resolved photoemission spectroscopy</p>
        <h1 class="hero-title">
          <span>ARPES</span>
          <span>Workshop</span>
          <span class="year">2026</span>
        </h1>
        <!-- 나중에 사진을 여기에 추가하세요: <img class="home-photo" src="photo.jpg" alt="Workshop photo"> -->
      </section>
      <section id="program" hidden>
        <h1>
          Program
        </h1>
      </section>
      <section id="venue" hidden>
        <h1>
          Venue
        </h1>
      </section>
      <section id="sponsors" hidden>
        <h1>
          Sponsors
        </h1>
      </section>
      <section id="contact" hidden>
        <h1>
          Contact
        </h1>
      </section>
    </main>
    <footer><span>ARPES Workshop 2026</span><span>2026</span></footer>
    <script>
      // 탭 클릭 또는 주소 변경 시 해당 영역만 표시합니다.
    const links = [...document.querySelectorAll('[data-page]')];

    function showPage() {
      const requested = location.hash.slice(1).toLowerCase();
      const page = links.some(link => link.dataset.page === requested)
        ? requested
        : 'home'; // 처음 열었을 때 표시할 탭

      document.querySelectorAll('main section').forEach(section => {
        section.hidden = section.id !== page;
      });

      links.forEach(link => {
        if (link.dataset.page === page) {
          link.setAttribute('aria-current', 'page');
        } else {
          link.removeAttribute('aria-current');
        }
      });

      document.title = 'ARPES Workshop 2026 | '
        + links.find(link => link.dataset.page === page).textContent.trim();
    }

    window.addEventListener('hashchange', showPage);
    showPage();

    // 돋보기 버튼: 검색창을 열거나 닫습니다.
    const toggle = document.querySelector('button');
    const form = document.querySelector('form');
    const input = form.querySelector('input');

    toggle.addEventListener('click', () => {
      form.hidden = !form.hidden;
      toggle.setAttribute('aria-expanded', String(!form.hidden));
      if (!form.hidden) input.focus();
    });

    // 검색창에 탭 이름을 입력하고 Enter를 누르면 이동합니다.
    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = input.value.trim().toLowerCase();
      const match = query && links.find(link =>
        link.textContent.toLowerCase().includes(query)
      );

      input.setCustomValidity(
        match ? '' : 'Enter Home, Program, Venue, Sponsors, or Contact.'
      );

      if (match) {
        location.hash = match.dataset.page;
        form.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        match.focus();
      } else {
        input.reportValidity();
      }
    });

    input.addEventListener('input', () => input.setCustomValidity(''));
    </script>
  </body>
</html>
