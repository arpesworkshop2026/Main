<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMS 2026 | Venue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202020;font-family:Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:12px 2.5%}.brand{font-size:32px;font-weight:800;letter-spacing:-1.5px;color:black;text-decoration:none;white-space:nowrap}nav{display:flex;align-items:center;gap:clamp(24px,3vw,64px)}nav a{font-size:32px;color:inherit;text-decoration:none;white-space:nowrap}nav a[aria-current="page"]{font-weight:800}button{border:0;background:none;padding:0;color:inherit;cursor:pointer}svg{display:block;width:32px;height:32px}main{width:80%;margin:48px auto 0}h1{margin:0;color:#1557cf;font-size:40px;font-weight:800}[hidden]{display:none!important}form{width:80%;margin:16px auto}input{width:100%;padding:12px;font:inherit;border:1px solid #aaa}:focus-visible{outline:3px solid #1557cf;outline-offset:5px}@media(min-width:1600px){.brand,nav a{font-size:44px}h1{font-size:56px}svg{width:44px;height:44px}}@media(max-width:850px){header{flex-wrap:wrap;padding:16px 5%;gap:20px}nav{flex-wrap:wrap;gap:18px}nav a{font-size:20px}.brand{font-size:28px}main{width:90%;margin-top:40px}h1{font-size:36px}}
</style>
</head>
<body>
<header>
<a class="brand" href="#home">QMS 2026</a>
<nav aria-label="Main navigation">
<a href="#home" data-page="home">Home</a>
<a href="#program" data-page="program">Program</a>
<a href="#venue" data-page="venue">Venue</a>
<a href="#sponsors" data-page="sponsors">Sponsors</a>
<a href="#contact" data-page="contact">Contact</a>
<button type="button" aria-label="Search tabs" aria-controls="search-form" aria-expanded="false"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10" stroke="currentColor" stroke-width="3"/><path d="M21 21L30 30" stroke="currentColor" stroke-width="3"/></svg></button>
</nav>
</header>
<form id="search-form" role="search" hidden><input type="search" aria-label="Search tabs" placeholder="Search: Home, Program, Venue, Sponsors, Contact"></form>
<main>
<!-- 각 section 안에 해당 탭의 내용을 추가하세요. -->
<section id="home" hidden><h1>Home</h1></section>
<section id="program" hidden><h1>Program</h1></section>
<section id="venue"><h1>Venue</h1></section>
<section id="sponsors" hidden><h1>Sponsors</h1></section>
<section id="contact" hidden><h1>Contact</h1></section>
</main>
<script>
const links=[...document.querySelectorAll('[data-page]')];
function showPage(){
 const requested=location.hash.slice(1).toLowerCase();
 const page=links.some(link=>link.dataset.page===requested)?requested:'venue';
 document.querySelectorAll('main section').forEach(section=>section.hidden=section.id!==page);
 links.forEach(link=>{if(link.dataset.page===page)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 document.title='QMS 2026 | '+document.getElementById(page).querySelector('h1').textContent;
}
window.addEventListener('hashchange',showPage);showPage();
const toggle=document.querySelector('button'),form=document.querySelector('form'),input=form.querySelector('input');
toggle.addEventListener('click',()=>{form.hidden=!form.hidden;toggle.setAttribute('aria-expanded',String(!form.hidden));if(!form.hidden)input.focus()});
form.addEventListener('submit',event=>{event.preventDefault();const query=input.value.trim().toLowerCase();const match=query&&links.find(link=>link.textContent.toLowerCase().includes(query));input.setCustomValidity(match?'':'Enter Home, Program, Venue, Sponsors, or Contact.');if(match){location.hash=match.dataset.page;form.hidden=true;toggle.setAttribute('aria-expanded','false');match.focus()}else input.reportValidity()});
input.addEventListener('input',()=>input.setCustomValidity(''));
</script>
</body>
</html>
