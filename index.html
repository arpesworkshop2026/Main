<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      ARPES Workshop 2026 | Venue
    </title>
    <style>
    * {
      box-sizing: border-box;
    }

    /* 전체 글씨체와 맨 위 여백: 약 두 줄 높이 */
    body {
      margin: 0;
      padding-top: 40px;
      background: white;
      color: #202020;
      font-family: Candara, "Calibri", "Segoe UI", sans-serif;
    }

    /* 최대 800px, 작은 화면에서는 좌우 16px 여백 */
    header, main, form {
      width: calc(100% - 32px);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 상단 로고와 메뉴 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: black;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 20px;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 20px;
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    nav a[aria-current="page"] {
      font-weight: 800;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 0;
      background: none;
      padding: 0;
      color: inherit;
      cursor: pointer;
    }

    svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    /* 본문과 상단 사이 여백 */
    main {
      margin-top: 40px;
    }

    h1 {
      margin: 0;
      color: #1557cf;
      font-size: 20px;
      font-weight: 800;
    }

    [hidden] {
      display: none !important;
    }

    /* 검색창: 위아래 여백과 입력칸 높이를 줄임 */
    form {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 7px 12px;
      font: inherit;
      font-size: 16px;
      line-height: 1.25;
      border: 1px solid #aaa;
    }

    :focus-visible {
      outline: 2px solid #1557cf;
      outline-offset: 3px;
    }

    /* 모바일: 로고 아래에 메뉴를 배치하고 자연스럽게 줄바꿈 */
    @media (max-width: 650px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      nav {
        width: 100%;
        gap: 4px 16px;
      }

      nav a {
        font-size: 15px;
      }

      main {
        margin-top: 32px;
      }
    }
    </style>
  </head>
  <body>
    <!-- 상단: 로고와 메뉴 -->
    <header>
      <a class="brand" href="#home">
      ARPES Workshop 2026
    </a>
      <nav aria-label="Main navigation">
        <a href="#home" data-page="home">
          Home
        </a>
        <a href="#program" data-page="program">
          Program
        </a>
        <a href="#venue" data-page="venue">
          Venue
        </a>
        <a href="#sponsors" data-page="sponsors">
          Sponsors
        </a>
        <a href="#contact" data-page="contact">
          Contact
        </a>
        <button type="button" aria-label="Search tabs" aria-controls="search-form" aria-expanded="false">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="13" cy="13" r="10" stroke="currentColor" stroke-width="3"/>
            <path d="M21 21L30 30" stroke="currentColor" stroke-width="3"/>
          </svg>
        </button>
      </nav>
    </header>
    <form id="search-form" role="search" hidden>
      <input type="search" aria-label="Search tabs" placeholder="Search: Home, Program, Venue, Sponsors, Contact">
    </form>
    <!-- 본문: 아래 section 안에 각 탭의 내용을 넣으세요. -->
    <main>
      <!-- 각 section 안에 해당 탭의 내용을 추가하세요. -->
      <section id="home" hidden>
        <h1>
          Home
        </h1>
      </section>
      <section id="program" hidden>
        <h1>
          Program
        </h1>
      </section>
      <section id="venue">
        <h1>
          Venue
        </h1>
      </section>
      <section id="sponsors" hidden>
        <h1>
          Sponsors
        </h1>
      </section>
      <section id="contact" hidden>
        <h1>
          Contact
        </h1>
      </section>
    </main>
    <script>
      // 탭 클릭 또는 주소 변경 시 해당 영역만 표시합니다.
    const links = [...document.querySelectorAll('[data-page]')];

    function showPage() {
      const requested = location.hash.slice(1).toLowerCase();
      const page = links.some(link => link.dataset.page === requested)
        ? requested
        : 'venue'; // 처음 열었을 때 표시할 탭

      document.querySelectorAll('main section').forEach(section => {
        section.hidden = section.id !== page;
      });

      links.forEach(link => {
        if (link.dataset.page === page) {
          link.setAttribute('aria-current', 'page');
        } else {
          link.removeAttribute('aria-current');
        }
      });

      document.title = 'ARPES Workshop 2026 | '
        + document.getElementById(page).querySelector('h1').textContent;
    }

    window.addEventListener('hashchange', showPage);
    showPage();

    // 돋보기 버튼: 검색창을 열거나 닫습니다.
    const toggle = document.querySelector('button');
    const form = document.querySelector('form');
    const input = form.querySelector('input');

    toggle.addEventListener('click', () => {
      form.hidden = !form.hidden;
      toggle.setAttribute('aria-expanded', String(!form.hidden));
      if (!form.hidden) input.focus();
    });

    // 검색창에 탭 이름을 입력하고 Enter를 누르면 이동합니다.
    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = input.value.trim().toLowerCase();
      const match = query && links.find(link =>
        link.textContent.toLowerCase().includes(query)
      );

      input.setCustomValidity(
        match ? '' : 'Enter Home, Program, Venue, Sponsors, or Contact.'
      );

      if (match) {
        location.hash = match.dataset.page;
        form.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        match.focus();
      } else {
        input.reportValidity();
      }
    });

    input.addEventListener('input', () => input.setCustomValidity(''));
    </script>
  </body>
</html>
